<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>CSS Flag Project</title>
  <style>
    .flag {
      width: 100;
      height:200px;
      position: relative;
      background-color: rgb(255, 103, 2);

    }

    .flag > div {
      background-color:white;
      height: 200px;
      width: 100%;
      position: absolute;
      top: 150px;
    }
    .flag > div  {
      background-color:green;
      height: 200px;
      width: 100%;
      position: absolute;
      top:410px;
    } 
    .flag > div > div {
      background-color:rgb(20, 20, 139);
      position: absolute;

      height: 220px;
      width: 240px;
      border-radius: 50%;
      top: -220px;
      left: 310px;
    }

    p {
      font-size: 5rem;
      color: white;
      text-align: center;
      padding: 0;
      margin: 0;
    }

    .flag>div div p {
      color: white;
    }
    
  </style>
</head>

<body>
  <div class="flag">
    <p>The Flag </p>
    <div>
      <div>
        <p>of INDIA</p>
      </div>
    </div>
  </div>
</body>

</html>
